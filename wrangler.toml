# GENERATED by app_builder (create-app / sync). Do not edit: change app.config.json
# or app_builder/platform.config.json, then run sync.
#
# Invite mode: friends join through links, with no login. play.example.com must NOT be behind
# Cloudflare Access; this Worker checks every request itself (see platform/host/src/turn/worker.ts).
# One secret, never committed: wrangler secret put HOST_KEY (at least 32 random characters).
# No other way in may exist, so workers.dev and preview URLs stay off.
name = "app-settlers"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

workers_dev = false
preview_urls = false
send_metrics = false

routes = [
  { pattern = "play.example.com/settlers", zone_name = "example.com" },
  { pattern = "play.example.com/settlers/*", zone_name = "example.com" },
]

[assets]
directory = "dist/friends"
binding = "ASSETS"
# Invite links (/settlers/r/<room>) load the client.
not_found_handling = "single-page-application"
# The Worker runs before every asset, so each response carries the security headers.
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "TurnRoom"

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "ProfileStore"

# Shared across every app: the account-wide usage meter lives in the platform Worker.
[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageMeter"
script_name = "app-platform"

# The free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TurnRoom", "ProfileStore"]
