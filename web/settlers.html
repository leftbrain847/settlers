<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Settlers</title>
<style>
:root { color-scheme: dark; --bg:#141a2e; --panel:#1b2440; --card:#243157; --text:#e8ecf4; --dim:#93a0ba; --border:#33416b; --accent:#00b4d8; --accent2:#f4a261; --good:#06d6a0; --sea:#5bb8d4; --sea2:#3aa8c5; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body, #app { height: 100%; background: var(--bg); color: var(--text); font: 15px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overscroll-behavior: none; }
button, select, input { font: inherit; color: inherit; }
.dim { color: var(--dim); } .small { font-size: 12px; }
h1 { font-size: 34px; letter-spacing: .5px; color: var(--accent2); }
h4 { margin: 12px 0 6px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
h4.group { margin-top: 16px; }

/* buttons */
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #04222a; }
.btn.big { min-height: 52px; font-size: 17px; }
.btn.small { min-height: 36px; font-size: 13px; }
.btn.danger { border-color: #b04a4a; color: #ff9a9a; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary:disabled { background: var(--card); border-color: var(--border); color: var(--dim); opacity: .8; }
.btn:active:not(:disabled) { transform: scale(.98); }
.icon { min-width: 44px; min-height: 44px; border: 0; background: none; font-size: 20px; cursor: pointer; }

/* lobby */
.lobby { max-width: 460px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 16px 40px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
.form { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--dim); }
.field input[type=text], .field input[type=number], .field select { min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; }
.field input[type=checkbox] { width: 24px; height: 24px; }
.field input[type=range] { width: 100%; }
.settings summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; color: var(--text); }
.settings .field { margin-top: 10px; }

/* game layout */
.game { height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
.top { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
.status { font-weight: 700; flex: 1; }
.dice { display: flex; align-items: center; gap: 4px; }
.die { width: 28px; height: 28px; border-radius: 6px; background: #f6f2e8; color: #222; font-weight: 800; display: grid; place-items: center; }
.die.off { opacity: .25; } .dice-total { margin-left: 4px; font-weight: 800; color: var(--accent2); }
.players { flex: none; display: flex; gap: 8px; padding: 8px 10px; overflow-x: auto; background: var(--bg); scrollbar-width: none; }
.pchip { flex: none; display: grid; grid-template-columns: auto 1fr auto; column-gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; background: var(--panel); border: 2px solid transparent; min-width: 0; }
/* Boxes share the row: three always fit a phone; from four on they keep a floor width and the row scrolls. */
.players > .pchip { flex: 1 0 104px; column-gap: 6px; }
.players > .pchip .dot { grid-row: 1; }
.players > .pchip .pmeta { grid-column: 1 / -1; overflow: hidden; gap: 2px; }
.players > .pchip .pmeta .ico { width: 11px; height: 11px; }
.players > .pchip .pmeta .ico + .ico, .players > .pchip .pmeta :not(.ico) + .ico { margin-left: 4px; }
.pchip.active { border-color: var(--accent2); }
.pchip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); grid-row: 1 / span 2; box-shadow: 0 0 0 2px rgba(255,255,255,.6); } /* light ring: the black seat must show on the dark bar */
.pname { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .pvp { font-weight: 800; color: var(--accent2); font-size: 13px; }
.pmeta { grid-column: 2 / span 2; font-size: 11px; color: var(--dim); white-space: nowrap; }
.badge { margin-left: 4px; padding: 0 5px; border-radius: 4px; background: var(--accent2); color: #1b1b1b; font-size: 10px; font-weight: 800; }
.boardwrap { position: relative; flex: 1; min-height: 0; background: radial-gradient(ellipse at center, var(--sea) 0%, var(--sea2) 100%); }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; }
.banner { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); max-width: 92%; padding: 6px 14px; border-radius: 999px; background: rgba(20,26,46,.86); font-weight: 700; font-size: 13px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner.urgent { background: var(--accent2); color: #1b1b1b; }
.toasts { position: absolute; top: 46px; left: 10px; right: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
.toast { padding: 6px 12px; border-radius: 8px; background: rgba(20,26,46,.92); font-size: 13px; animation: pop .2s ease-out; } .toast.bad { background: #8a2f2f; }
@keyframes pop { from { transform: translateY(-6px); opacity: 0; } }

.dock { flex: none; background: var(--panel); border-top: 1px solid var(--border); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
.hand { display: flex; gap: 6px; }
.hcard { flex: 1; min-width: 0; border-radius: 8px; padding: 4px 2px; text-align: center; background: var(--card); border-bottom: 4px solid var(--c, var(--border)); display: flex; flex-direction: column; }
.hcard .hn { font-size: 20px; font-weight: 800; line-height: 1.1; } .hcard .hl { font-size: 10px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.actions { display: flex; gap: 8px; min-height: 44px; } .actions .btn { flex: 1; } .actions .btn.big { flex: 2; }

/* sheets */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; }
.backdrop.modal { background: rgba(0,0,0,.6); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 82dvh; display: flex; flex-direction: column; background: var(--panel); border-radius: 18px 18px 0 0; border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); animation: up .18s ease-out; max-width: 560px; margin: 0 auto; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 0 16px; min-height: 48px; }
.sheet-body { padding: 4px 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.list { display: flex; flex-direction: column; gap: 8px; } .col { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--card); } .row.off { opacity: .55; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; } .btnrow .btn { flex: 1; }
.costs { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chip.res { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 14px; font-weight: 800; background: var(--bg); color: var(--text); border: 2px solid var(--c); }
.chip.res .ico { color: var(--c); }
.trade .chip.res { font-size: 17px; padding: 5px 12px 5px 9px; }
.trade .chip.res .ico { width: 20px; height: 20px; }
.trade .side { padding: 10px; } .trade .costs { gap: 6px; }
.steppers { display: flex; flex-direction: column; gap: 6px; }
.stepper { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-radius: 10px; background: var(--card); border-left: 6px solid var(--c); }
.stepper-name { flex: 1; font-weight: 600; } .step-val { min-width: 24px; text-align: center; font-weight: 800; font-size: 18px; }
.step { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: 22px; font-weight: 700; cursor: pointer; } .step:disabled { opacity: .3; }
.tabs { display: flex; gap: 6px; } .tab { flex: 1; min-height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-weight: 600; } .tab.on { background: var(--accent); color: #04222a; border-color: var(--accent); }
.pickrow { display: flex; gap: 6px; flex-wrap: wrap; }
.res-btn { flex: 1; min-width: 70px; border-left: 6px solid var(--c); } .res-btn.on { background: var(--accent); color: #04222a; } 
.trade { display: flex; align-items: center; gap: 8px; } .trade .side { flex: 1; padding: 8px; border-radius: 10px; background: var(--card); } .side-label { font-size: 11px; color: var(--dim); margin-bottom: 4px; } .arrow { font-size: 22px; color: var(--dim); }
.timer { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; } .timer-fill { height: 100%; width: 100%; background: var(--accent2); transform-origin: left; animation: shrink linear forwards; } @keyframes shrink { to { transform: scaleX(0); } }
.mute summary { min-height: 40px; display: flex; align-items: center; color: var(--dim); font-size: 13px; cursor: pointer; }
.log { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; } .log li { padding: 6px 8px; border-radius: 6px; background: var(--card); }

.overlay:not(:empty) { position: fixed; inset: 0; z-index: 20; background: rgba(8,10,20,.8); display: grid; place-items: center; padding: 20px; }
.winner { width: min(380px, 100%); background: var(--panel); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.score { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 8px; background: var(--card); } .score.win { outline: 2px solid var(--accent2); }

/* board svg */
.hex { stroke: rgba(0,0,0,.45); stroke-width: 1.5; stroke-linejoin: round; }
.terrain-label { font-size: 7px; font-weight: 700; fill: #fff; stroke: rgba(0,0,0,.65); stroke-width: 2.2px; paint-order: stroke; text-anchor: middle; pointer-events: none; }
.token { fill: #f6f2e8; stroke: rgba(0,0,0,.4); stroke-width: 1; } .token-num { font-size: 13px; font-weight: 800; fill: #222; text-anchor: middle; dominant-baseline: central; pointer-events: none; } .token-num.red { fill: #c62828; }
.pip { fill: #555; } .pip.red { fill: #c62828; }
.port-line { stroke: rgba(30,40,60,.6); stroke-width: 1.4; stroke-dasharray: 3 2; } .port-badge { fill: #fdf6e3; stroke: #345; stroke-width: 2; } .port-text { font-size: 6.5px; font-weight: 800; fill: #223; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
/* The terrain is muted so player pieces stand out; number tokens stay full strength. */
.hexes > .hex, .hexes > .scene, .hexes > .terrain-ico { filter: saturate(.55) brightness(.7); }
.road-edge { stroke: rgba(0,0,0,.8); stroke-width: 11; stroke-linecap: round; } .road { stroke-width: 7; stroke-linecap: round; } .road.ghost, .piece.ghost { opacity: .6; }
.piece-shape { stroke: #111; stroke-width: 2; stroke-linejoin: round; }
.robber { fill: #20242c; stroke: #fff; stroke-width: 1; opacity: .92; pointer-events: none; }
.target-dot { fill: var(--accent2); opacity: .9; pointer-events: none; animation: pulse 1.1s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .55; } }
.target-hit { fill: transparent; pointer-events: all; }
.target-edge-vis { stroke: var(--accent2); stroke-width: 5; stroke-dasharray: 5 4; stroke-linecap: round; opacity: .95; pointer-events: none; }
.target-edge-hit { stroke: transparent; stroke-width: 26; stroke-linecap: round; pointer-events: stroke; }
.target-hex { fill: rgba(255,255,255,.16); stroke: var(--accent2); stroke-width: 2; pointer-events: all; } .target-hex.selected { fill: rgba(244,162,97,.4); pointer-events: none; } .target-ring { fill: none; stroke: var(--accent2); stroke-width: 2.5; pointer-events: none; }

.rgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rcell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 4px; border-radius: 10px; background: var(--card); border-top: 4px solid var(--c); min-width: 0; }
.rcell.has { background: var(--bg); box-shadow: inset 0 0 0 2px var(--c); }
.rname { font-size: 11px; color: var(--dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.rval { font-size: 24px; font-weight: 800; line-height: 1.1; }
.rhave { font-size: 11px; color: var(--dim); }
.rcell.none { opacity: .45; }
.pm { display: flex; gap: 3px; width: 100%; padding: 0 3px; }
.pm .step { flex: 1; width: auto; min-width: 0; height: 40px; font-size: 20px; }
.sheet-body h4 { margin: 6px 0 4px; }

.pill { min-width: 44px; min-height: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; }
.pill.on { background: var(--accent2); color: #1b1b1b; border-color: var(--accent2); }
.field.check { flex-direction: row; align-items: center; gap: 10px; }

/* online */
h3 { font-size: 16px; }
.err { color: #ff8a8a; min-height: 1em; }
.warn { color: var(--accent2); }
code.link { display: block; padding: 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); font-size: 12px; word-break: break-all; user-select: all; }
.rejoin { border-color: var(--accent); }
.seat-pick { min-height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); max-width: 45%; }

/* icons and visual feedback */
.ico { fill: currentColor; flex: none; vertical-align: middle; }
.terrain-ico { color: rgba(255, 255, 255, 0.95); filter: drop-shadow(0 0 1.2px rgba(0, 0, 0, 0.7)); pointer-events: none; }
.port-ico { fill: currentColor; pointer-events: none; }
.scene { pointer-events: none; }
.rname .ico { color: var(--c); width: 24px; height: 24px; }
.rname { display: grid; place-items: center; min-height: 26px; }
.hcard { align-items: center; justify-content: center; gap: 2px; padding: 6px 2px 4px; }
.hcard .ico { color: var(--c); }
.hcard.dev .ico { color: var(--dim); }
.res-btn { display: grid; place-items: center; min-height: 48px; }
.res-btn .ico { color: var(--c); }
.res-btn.on .ico { color: #04222a; }
.tradeline { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
.devname { display: inline-flex; align-items: center; gap: 6px; }
.chip.res .cn { font-variant-numeric: tabular-nums; }

.pchip { grid-template-columns: auto 1fr auto; }
.pvp { display: inline-flex; align-items: center; gap: 3px; }
.pvp .ico { color: var(--accent2); }
.pmeta { display: flex; align-items: center; flex-wrap: nowrap; gap: 3px; }
.pmeta .ico { color: var(--dim); }
.pmeta .ico + .ico, .pmeta :not(.ico) + .ico { margin-left: 5px; }
.owes { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: #8a2f2f; color: #fff; font-weight: 800; }
.pchip.me { box-shadow: inset 0 -3px 0 var(--pc), inset 0 -4px 0 rgba(255,255,255,.5); }
.badge { display: inline-grid; place-items: center; padding: 2px 4px; }
.badge .ico { color: #1b1b1b; }
.think { display: inline-flex; gap: 3px; margin-left: 6px; align-self: center; }
.think i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent2); animation: think 1s infinite ease-in-out; }
.think i:nth-child(2) { animation-delay: 0.15s; } .think i:nth-child(3) { animation-delay: 0.3s; }
@keyframes think { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-4px); opacity: 1; } }

.banner { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; }
.banner[hidden] { display: none; }
.banner .ico { color: #1b1b1b; animation: nudge 1.4s infinite ease-in-out; }
.banner .cnt { font-weight: 900; font-size: 15px; }
@keyframes nudge { 50% { transform: translateY(-2px) scale(1.08); } }

.bank { position: absolute; top: 8px; left: 10px; display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; background: rgba(20, 26, 46, 0.7); color: var(--text); font-size: 12px; font-weight: 800; pointer-events: none; }
.bank .ico { color: var(--accent2); }
.bank .ico + .ico { color: var(--dim); }

.fx { position: fixed; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; }
.fxcard { position: fixed; width: 24px; height: 32px; border-radius: 5px; display: grid; place-items: center; background: var(--c, #2b3a67); color: #12161f; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45); pointer-events: none; will-change: transform, opacity; }
.fxcard.back { background: #2b3a67; color: #9db0e6; border: 1px solid #6c82c9; }
.fxbig { position: fixed; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: rgba(20, 26, 46, 0.9); color: var(--accent2); box-shadow: 0 0 0 3px var(--accent2), 0 6px 18px rgba(0, 0, 0, 0.5); pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.die { color: #222; }
.die .face { fill: #222; }
.die .ico { fill: currentColor; }
.die.roll { animation: tumble 0.75s cubic-bezier(0.2, 0.8, 0.3, 1); }
@keyframes tumble { 0% { transform: rotate(0) scale(0.5); opacity: 0.2; } 60% { transform: rotate(560deg) scale(1.25); opacity: 1; } 100% { transform: rotate(720deg) scale(1); } }

.piece-shape.pop { transform-box: fill-box; transform-origin: center; animation: pop 0.5s cubic-bezier(0.2, 1.7, 0.4, 1); }
.road.pop, .road-edge.pop { animation: grow 0.55s ease-out; }
@keyframes pop { from { transform: scale(0); } }
@keyframes grow { from { stroke-width: 0; } }
.badge.pop { animation: badge-pop 0.7s cubic-bezier(0.2, 1.7, 0.4, 1); }
@keyframes badge-pop { from { transform: scale(0) rotate(-40deg); } }
.pchip.turn { animation: turn 0.9s ease-out; }
@keyframes turn { 0% { box-shadow: 0 0 0 0 var(--accent2); } 100% { box-shadow: 0 0 0 14px transparent; } }
.bump { animation: bump 0.4s ease-out; }
@keyframes bump { 40% { transform: scale(1.07); filter: brightness(1.4); } }
.dock.mine { box-shadow: inset 0 3px 0 var(--accent2); }
.actions .btn .ico { margin-right: 6px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<div id="app"></div>
